<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>비밀번호 찾기</title>
</head>
<body>
	<h1>비밀번호 찾기</h1>
	<form action="/user/find-password" method="post">
		<label for="userId">아이디:</label>
		<input type="text" id="userId" name="userId" required><br>
		
		<button type="submit">비밀번호 변경</button>
	</form>
	
	<p><a href="/user/login">로그인으로 돌아가기</a></p>
	
	<div th:if="${error}" style="color:red;">
		<p th:text="${error}"></p>
	</div>
</body>
</html>
