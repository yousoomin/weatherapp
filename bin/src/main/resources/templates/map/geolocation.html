<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>geolocation으로 마커 표시하기</title>
</head>
<body>
<p style="margin-top:-12px">
    <b>Chrome 브라우저는 https 환경에서만 geolocation을 지원합니다.</b> 참고해주세요.
</p>
<div id="map" style="width:100%;height:350px;"></div>
<p>현재 위치: <span id="XY">-</span></p>
<input type="text" id="markerText" placeholder="마커에 표시할 내용을 입력하세요">
<p>클릭한 위치: 위도 <span id="latitude">-</span>, 경도 <span id="longitude">-</span></p>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c35e60e72f1d7955894d21d3b6ea1ee2&libraries=services"></script>
<script src="/js/geolocation.js" type="module"></script>
</body>
</html>
