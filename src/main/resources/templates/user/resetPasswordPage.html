<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<form action="/api/password/reset" method="POST">
    <input type="hidden" name="token" value="랜덤토큰" />
    <input type="password" name="newPassword" placeholder="새 비밀번호" required />
    <input type="password" name="confirmPassword" placeholder="비밀번호 확인" required />
    <button type="submit">비밀번호 재설정</button>
</form>
</body>
</html>
