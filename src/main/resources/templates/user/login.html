<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>로그인</title>
	<link rel="stylesheet" href="/css/login.css"> <!-- CSS 파일 링크 -->
</head>
<body>
<th:block th:if="${session.userId == null}">
	<div class="login-container">
		<div>
			<a href="/" >
				<img src="/image/uipng/homeIcon.png" class="homeIcon" alt="뒤로가기" width="25" height="25"> <!-- 화살표 이미지 -->
			</a>
			<h1>로그인</h1>
		</div>

		<form action="/user/login" method="post">
			<div>
				<label for="username">아이디:</label>
				<input type="text" id="username" name="userId" required>
			</div>
			<div>
				<label for="password">비밀번호:</label>
				<input type="password" id="password" name="password" required>
			</div>
			<button type="submit">로그인</button>
		</form>

		<div class="footer-links" style="text-align: center; margin-top: 20px;">
			<a href="/user/register">회원가입</a> |
			<a href="/user/find-password">비밀번호 찾기</a>
		</div>
		<div th:if="${error}" class="error">
			<p th:text="${error}"></p>
		</div>
	</div>
</th:block>
<th:block th:if="${session.userId != null}">

	<div class="footer-links">
		<p th:text="${session.userId + ' 님 환영합니다.'}"></p>
		<a href="/user/profile">마이 페이지</a>
		<a href="/user/logout">로그아웃</a><br><br>
		<a href="/">메인으로</a>
	</div>
</th:block>
</body>
</html>
